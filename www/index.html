<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام المحاسبة</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b1f2a;--mut:#6b7280;--pri:#1f3864;--bd:#d6dae3;--in:#fffbe0;--ok:#1e7a3c;--bad:#b42318;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212b;--tx:#e8eaf0;--mut:#9aa3b2;--pri:#4f7cc7;--bd:#323a49;--in:#2a2a14;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212b;--tx:#e8eaf0;--mut:#9aa3b2;--pri:#4f7cc7;--bd:#323a49;--in:#2a2a14;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Arial,Tahoma,sans-serif;font-size:16px;padding:14px 14px 90px;max-width:560px;margin:auto}
h1,h2{margin:6px 0 12px;font-size:22px;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx)}
button{font-family:inherit;font-size:17px;border:0;border-radius:12px;padding:14px;background:var(--pri);color:#fff;width:100%;margin-top:14px}
button.big{font-size:20px;padding:22px;margin:0 0 12px}
button.sm{width:auto;padding:8px 12px;font-size:14px;margin:0}
button.ghost{background:transparent;color:var(--pri);border:1px solid var(--bd);margin-top:8px}
button.del{background:transparent;color:var(--bad);padding:6px 8px;font-size:14px;width:auto;margin:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:15px}
.row:last-child{border-bottom:0}.mut{color:var(--mut);font-size:13px}.num{font-weight:bold;white-space:nowrap}
.bad{color:var(--bad)}.ok{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:10px 6px;border-bottom:1px solid var(--bd);text-align:right}th{color:var(--mut);font-size:13px}
#toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:9;left:50%;transform:translateX(-50%);background:var(--pri);color:#fff;padding:12px 18px;border-radius:12px;display:none;z-index:9;max-width:90%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fixbar{position:fixed;bottom:0;left:0;right:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);z-index:5}
.fixbar button{display:block;max-width:532px;margin:0 auto}
.credit{text-align:center;color:var(--mut);font-size:13px;margin:16px 0}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
let recs=[],coll=null,view='home',cfg={rate:15000},qs={n:'',f:'',t:''},js={f:'',t:''};
const $=s=>document.getElementById(s),today=()=>new Date().toLocaleDateString('sv');
const fm=n=>(Math.round(n*100)/100).toLocaleString('en'),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const of=t=>recs.filter(r=>r.t===t),V=id=>($(id)?.value||'').trim();
const inr=(r,o)=>(!o.f||r.d>=o.f)&&(!o.t||r.d<=o.t);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600)}
function go(v){view=v;render();window.scrollTo(0,0)}
function back(){return '<div class="fixbar"><button onclick="go(\'home\')">← الرئيسية</button></div>'}
function recent(t,fn){const a=of(t).sort((x,y)=>y.ts-x.ts).slice(0,15);
 return `<div class="card"><div class="mut">آخر العمليات</div>${a.map(r=>`<div class="row"><div>${fn(r)}</div><button class="del" onclick="del('${r.id}',this)">حذف</button></div>`).join('')||'<div class="mut">لا توجد عمليات بعد</div>'}</div>`}
function del(id,b){if(b.dataset.c){coll.doc(id).delete()}else{b.dataset.c=1;b.textContent='تأكيد؟';setTimeout(()=>{b.dataset.c='';b.textContent='حذف'},3000)}}
const names=()=>[...new Set(of('sale').map(r=>r.c))];
const dl=()=>`<datalist id="cl">${names().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`;

const rx=r=>r.x>0?r.x:cfg.rate,rd=n=>Math.round(n*100)/100;
function debts(o,name){const m={},k=c=>c.trim();
 of('sale').filter(r=>inr(r,o)&&(!name||k(r.c)===name)&&r.ty==='آجل').forEach(r=>m[k(r.c)]=(m[k(r.c)]||0)+(r.a-(r.p||0))/rx(r));
 of('pay').filter(r=>inr(r,o)&&(!name||k(r.c)===name)).forEach(r=>{const c=k(r.c);if(c in m)m[c]-=r.a/rx(r)});
 for(const c in m)if(m[c]<0.005)delete m[c];return m}
function lnk(l,d,r,f){const x=parseFloat(V(r))||0;if(f==='l'){const a=parseFloat(V(l));$(d).value=a>0&&x>0?rd(a/x):''}else{const u=parseFloat(V(d));$(l).value=u>0&&x>0?rd(u*x):''}}
function rt(l,d,r){const x=parseFloat(V(r));if(x>0){setRate(x);lnk(l,d,r,V(l)?'l':'d')}}
function amt(l,d,r){const x=parseFloat(V(r)),u=parseFloat(V(d));let a=parseFloat(V(l));if(!(a>0)&&u>0&&x>0)a=u*x;return[a,x]}
const pair=(l,d,r)=>`<label>المبلغ بالعملة المحلية</label><input id="${l}" type="number" inputmode="decimal" oninput="lnk('${l}','${d}','${r}','l')">
<label>المبلغ بالدولار</label><input id="${d}" type="number" inputmode="decimal" oninput="lnk('${l}','${d}','${r}','d')">
<label>سعر صرف اليوم</label><input id="${r}" type="number" inputmode="decimal" value="${cfg.rate}" onchange="rt('${l}','${d}','${r}')">`;
function purge(){const cl=new Set(of('sale').filter(r=>r.ty==='آجل').map(r=>r.c.trim()));recs=recs.filter(r=>r.t!=='pay'||cl.has(r.c.trim()))}

function render(){const a=$('app');
 if(!coll){a.innerHTML='<div class="card">يلزم فتح هذه الصفحة داخل تطبيق Claude مع تسجيل الدخول لحفظ البيانات.</div>';return}
 a.innerHTML=({home,sale,purch,exp,query,jard})[view]();if(view==='query')res()}

function home(){return `<h1>نظام المحاسبة</h1>
<button class="big" onclick="go('sale')">المبيعات</button><button class="big" onclick="go('purch')">المشتريات</button>
<button class="big" onclick="go('exp')">المصاريف</button><button class="big" onclick="go('query')">استعلام</button><button class="big" onclick="go('jard')">جرد</button>
<div class="card"><label>سعر صرف الدولار اليوم</label><input id="rate" type="number" inputmode="decimal" value="${cfg.rate}" onchange="setRate(this.value)"></div>
<div class="card"><div class="mut">نسخة احتياطية (احتفظ بها قبل حذف التطبيق أو تغيير الهاتف)</div><textarea id="bk" rows="3" style="width:100%;margin-top:8px;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx)" placeholder="الصق هنا نص النسخة الاحتياطية لاستعادتها"></textarea><div class="two"><button class="ghost" onclick="backup()">نسخ البيانات</button><button class="ghost" onclick="restore()">استعادة</button></div></div><div class="credit">تصميم : شريف ابو ايمن</div>`}
function setRate(v){v=parseFloat(v);if(v>0){coll.doc('cfg').set({t:'cfg',rate:v});toast('تم حفظ سعر الصرف')}}

function sale(){return `<h2>المبيعات</h2><div class="card">${dl()}
<label>اسم العميل</label><input id="s1" list="cl"><label>اسم المادة</label><input id="s2">${pair('s3','s7','s8')}
<label>نقدي / آجل</label><select id="s4" onchange="$('pw').style.display=this.value==='آجل'?'block':'none'"><option>نقدي</option><option>آجل</option></select>
<div id="pw" style="display:none"><label>المدفوع الآن بالمحلي (اختياري، والباقي يُسجَّل دينا بالدولار)</label><input id="s5" type="number" inputmode="decimal"></div>
<label>التاريخ</label><input id="s6" type="date" value="${today()}"><button onclick="postSale()">ترحيل</button></div>
${recent('sale',r=>`${esc(r.c)} · ${esc(r.i)}<div class="mut">${r.d} · ${r.ty} · <span class="num">${fm(r.a)}</span> ($${fm(r.a/rx(r))}) · صرف ${fm(rx(r))}</div>`)}${back()}`}
function postSale(){const c=V('s1'),i=V('s2'),ty=V('s4'),p=parseFloat(V('s5'))||0,d=V('s6'),[a,x]=amt('s3','s7','s8');
 if(!c||!i||!(a>0)||!(x>0)||!d)return toast('يرجى تعبئة كل الخانات بشكل صحيح');
 if(p<0||p>a)return toast('المبلغ المدفوع غير صحيح');
 coll.add({t:'sale',c,i,a,x,ty,p:ty==='آجل'?p:0,d,ts:Date.now()});toast('تم ترحيل عملية البيع')}

function purch(){return `<h2>المشتريات</h2><div class="card">
<label>اسم المادة</label><input id="p1"><label>سعر المادة بالدولار</label><input id="p2" type="number" inputmode="decimal">
<label>سعر صرف اليوم للدولار</label><input id="p3" type="number" inputmode="decimal" value="${cfg.rate}">
<label>الكمية / العدد</label><input id="p4" type="number" inputmode="decimal"><label>التاريخ</label><input id="p5" type="date" value="${today()}">
<button onclick="postPurch()">ترحيل</button></div>
${recent('purch',r=>`${esc(r.i)} × ${r.q}<div class="mut">${r.d} · $${fm(r.u)} · صرف ${fm(r.x)} · <span class="num">${fm(r.u*r.q*r.x)}</span></div>`)}${back()}`}
function postPurch(){const i=V('p1'),u=parseFloat(V('p2')),x=parseFloat(V('p3')),q=parseFloat(V('p4')),d=V('p5');
 if(!i||!(u>0)||!(x>0)||!(q>0)||!d)return toast('يرجى تعبئة كل الخانات بشكل صحيح');
 coll.add({t:'purch',i,u,x,q,d,ts:Date.now()});toast('تم ترحيل عملية الشراء')}

function exp(){return `<h2>المصاريف</h2><div class="card"><label>الاسم</label><input id="e1">${pair('e2','e4','e5')}
<label>التاريخ</label><input id="e3" type="date" value="${today()}"><button onclick="postExp()">ترحيل</button></div>
${recent('exp',r=>`${esc(r.n)}<div class="mut">${r.d} · <span class="num">${fm(r.a)}</span> ($${fm(r.a/rx(r))}) · صرف ${fm(rx(r))}</div>`)}${back()}`}
function postExp(){const n=V('e1'),d=V('e3'),[a,x]=amt('e2','e4','e5');
 if(!n||!(a>0)||!(x>0)||!d)return toast('يرجى تعبئة كل الخانات بشكل صحيح');
 coll.add({t:'exp',n,a,x,d,ts:Date.now()});toast('تم ترحيل المصروف')}

function query(){return `<h2>استعلام</h2><div class="card">${dl()}
<label>اسم العميل (اتركه فارغا لعرض كل المديونين)</label><input id="q1" list="cl" value="${esc(qs.n)}" oninput="qs.n=this.value.trim();res()">
<div class="two"><div><label>من تاريخ</label><input id="q2" type="date" value="${qs.f}" onchange="qs.f=this.value;res()"></div>
<div><label>إلى تاريخ</label><input id="q3" type="date" value="${qs.t}" onchange="qs.t=this.value;res()"></div></div></div>
<div id="res"></div>${back()}`}
function res(){const el=$('res');if(!el)return;const n=qs.n,m=debts(qs,n),R=cfg.rate;
 const ss=of('sale').filter(r=>inr(r,qs)&&(!n||r.c.trim()===n)),ps=of('pay').filter(r=>inr(r,qs)&&(!n||r.c.trim()===n));
 const tl=ss.reduce((s,r)=>s+r.a,0),tu=ss.reduce((s,r)=>s+r.a/rx(r),0),du=Object.values(m).reduce((s,v)=>s+v,0);
 const dd=Object.entries(m).sort((a,b)=>b[1]-a[1]);
 const st=[...ss.map(r=>({d:r.d,x:`${esc(r.i)} (${r.ty}) ${fm(r.a)} = $${fm(r.a/rx(r))} · صرف ${fm(rx(r))}`+(r.p?` · دفع ${fm(r.p)}`:'')})),...ps.map(r=>({d:r.d,x:`<span class="ok">تسديد ${fm(r.a)} = $${fm(r.a/rx(r))} · صرف ${fm(rx(r))}</span>`}))].sort((a,b)=>b.d.localeCompare(a.d));
 el.innerHTML=`<div class="card"><div class="row"><span>إجمالي المبيعات</span><span class="num">${fm(tl)} · $${fm(tu)}</span></div>
<div class="row"><span>إجمالي الديون (بالدولار)</span><span class="num bad">$${fm(du)}</span></div>
<div class="row"><span>المطلوب تحصيله اليوم (بصرف ${fm(R)})</span><span class="num bad">${fm(du*R)}</span></div></div>
<div class="card"><div class="mut">العملاء المديونون (الدين ثابت بالدولار بسعر يوم الاستدانة)</div>${dd.map(([k,v],i)=>`<div class="row" style="flex-wrap:wrap"><b>${esc(k)}</b><span class="num bad">$${fm(v)} ≈ ${fm(v*R)}</span>
<input id="pay${i}" type="number" inputmode="decimal" placeholder="مبلغ التسديد" style="flex:1;padding:8px"><select id="pc${i}" style="width:auto;padding:8px"><option>محلي</option><option>دولار</option></select><button class="sm" onclick="payDebt(${i},'${esc(k).replace(/'/g,"\\'")}')">تسديد</button></div>`).join('')||'<div class="mut">لا توجد ديون</div>'}</div>
<div class="card"><div class="mut">آخر التسديدات</div>${[...ps].sort((a,b)=>b.ts-a.ts).slice(0,10).map(r=>`<div class="row"><span>${esc(r.c)} · ${r.d} · <span class="num ok">${fm(r.a)} = $${fm(r.a/rx(r))}</span></span><button class="del" onclick="del('${r.id}',this)">حذف</button></div>`).join('')||'<div class="mut">لا توجد تسديدات</div>'}</div>
${n?`<div class="card"><div class="mut">كشف حساب ${esc(n)}</div>${st.map(r=>`<div class="row"><span>${r.x}</span><span class="mut">${r.d}</span></div>`).join('')||'<div class="mut">لا توجد عمليات</div>'}</div>`:''}`}
function payDebt(i,c){let a=parseFloat(V('pay'+i));const x=cfg.rate;if(!(a>0)||!(x>0))return toast('اكتب مبلغ التسديد');
 if(V('pc'+i)==='دولار')a=a*x;coll.add({t:'pay',c,a,x,d:today(),ts:Date.now()});toast('تم تسجيل التسديد بسعر صرف اليوم')}

function jard(){const o=js,r=cfg.rate,f=a=>a.filter(x=>inr(x,o)),sa=f(of('sale')),pu=f(of('purch')),ex=f(of('exp'));
 const sum=(a,g)=>a.reduce((s,x)=>s+g(x),0),pl=x=>x.u*x.q*rx(x);
 const SL=sum(sa,x=>x.a),SU=sum(sa,x=>x.a/rx(x)),PL=sum(pu,pl),PU=sum(pu,x=>x.u*x.q),EL=sum(ex,x=>x.a),EU=sum(ex,x=>x.a/rx(x)),
 DU=Object.values(debts(o,'')).reduce((s,v)=>s+v,0),dy={};
 const day=(d,l,u)=>{(dy[d]=dy[d]||{l:0,u:0});dy[d].l+=l;dy[d].u+=u};
 sa.forEach(x=>day(x.d,x.a,x.a/rx(x)));pu.forEach(x=>day(x.d,-pl(x),-x.u*x.q));ex.forEach(x=>day(x.d,-x.a,-x.a/rx(x)));
 const row=(l,a,b,c='')=>`<tr><td>${l}</td><td class="num ${c}">${fm(a)}</td><td class="num ${c}">$${fm(b)}</td></tr>`,PRL=SL-PL-EL,PRU=SU-PU-EU;
 return `<h2>جرد</h2><div class="card"><div class="two"><div><label>من تاريخ</label><input type="date" value="${js.f}" onchange="js.f=this.value;render()"></div>
<div><label>إلى تاريخ</label><input type="date" value="${js.t}" onchange="js.t=this.value;render()"></div></div></div>
<div class="card"><table><tr><th></th><th>محلي</th><th>دولار</th></tr>${row('إجمالي المبيعات',SL,SU)}${row('إجمالي المشتريات',PL,PU)}${row('إجمالي المصاريف',EL,EU)}
${row('إجمالي الديون (بصرف اليوم)',DU*r,DU,'bad')}${row('إجمالي الأرباح',PRL,PRU,PRU>=0?'ok':'bad')}</table>
<p class="mut">كل عملية تُحسب بسعر صرفها وقت تسجيلها، وإجمالي الأرباح هو مجموع أرباح الأيام. الديون ثابتة بالدولار وتُقدَّر بالمحلي بصرف اليوم (${fm(r)}).</p></div>
<div class="card"><div class="mut">الأرباح اليومية</div><table><tr><th>اليوم</th><th>محلي</th><th>دولار</th></tr>${Object.keys(dy).sort().reverse().map(d=>`<tr><td>${d}</td><td class="num ${dy[d].u>=0?'ok':'bad'}">${fm(dy[d].l)}</td><td class="num ${dy[d].u>=0?'ok':'bad'}">$${fm(dy[d].u)}</td></tr>`).join('')||'<tr><td colspan="3" class="mut">لا توجد عمليات</td></tr>'}</table></div>${back()}`}
const KEY='acc_v1';
try{const st=JSON.parse(localStorage.getItem(KEY)||'{}');recs=st.recs||[];if(st.cfg&&st.cfg.rate)cfg=st.cfg}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({recs,cfg}))}catch(e){toast('تعذر حفظ البيانات: المساحة ممتلئة')}};
coll={add(o){o.id='r'+Date.now()+Math.random().toString(36).slice(2,6);recs.push(o);save();render();return Promise.resolve()},
 doc(id){return{delete(){recs=recs.filter(r=>r.id!==id);purge();save();render()},set(o){cfg={rate:o.rate};save()}}}};
function backup(){const t=$('bk');t.value=JSON.stringify({recs,cfg});t.focus();t.select();try{document.execCommand('copy');toast('تم نسخ البيانات: الصقها في ملاحظات أو أرسلها لنفسك')}catch(e){toast('حدّد النص وانسخه يدويا')}}
function restore(){const v=$('bk').value.trim();try{const o=JSON.parse(v);if(!Array.isArray(o.recs))throw 0;recs=o.recs;if(o.cfg&&o.cfg.rate)cfg=o.cfg;purge();save();render();toast('تمت استعادة البيانات')}catch(e){toast('الصق نص النسخة الاحتياطية أولا')}}
purge();save();render();
</script></body></html>
